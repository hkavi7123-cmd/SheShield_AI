  name: sheshieldai
  description: "A new Flutter project."
  publish_to: 'none'

  version: 1.0.0+1

  environment:
    sdk: ^3.12.2

  dependencies:
    flutter:
      sdk: flutter

    cupertino_icons: ^1.0.8

    # Firebase
    firebase_core: ^3.6.0
    firebase_auth: ^5.3.1
    cloud_firestore: ^5.4.4

    # Local Storage
    shared_preferences: ^2.5.3

    # Location
    geolocator: ^13.0.2
    geocoding: ^3.0.0

    # Google Maps
    google_maps_flutter: ^2.12.3

    # URL / SMS / Network
    url_launcher: ^6.3.1
    http: ^1.2.2

    # Voice Detection
    speech_to_text: ^7.0.0

    # Permissions & Hardware Sensors
    permission_handler: ^11.4.0
    camera: ^0.12.0+2
    sensors_plus: ^6.1.1

  dev_dependencies:
    flutter_test:
      sdk: flutter

    flutter_lints: ^6.0.0

  flutter:
    uses-material-design: true

    # SheShield AI images
    assets:
      - assets/logo.jpg
      - assets/onboarding1.png
      - assets/onboarding2.png
      - assets/onboarding3.png